# Opens a pull request when this repo's AI coding rules fall behind.
#
# The rules a repo hands its AI assistant go stale the same way dependencies
# do — a vendor changes a default and the rule keeps confidently stating the
# old one. This is the Dependabot equivalent: a small, reviewable PR whenever
# there is something to refresh, and silence when there is not.
#
# Uses `gh` rather than a third-party pull-request action on purpose: nothing
# here runs code from outside GitHub and this repository.
name: Refresh AI rules

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# The branch is fixed, so a second run updates the open PR instead of opening
# a second one.
env:
  BRANCH: ai-rules/refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Captured before upgrading: afterwards there is nothing left to report.
      - id: check
        run: |
          npx --yes ai-project-bootstrap check --json > /tmp/check.json || true
          echo "behind=$(jq -r '.counts.behind' /tmp/check.json)" >> "$GITHUB_OUTPUT"
          echo "edited=$(jq -r '.counts.edited' /tmp/check.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.generatorVersion.installed' /tmp/check.json)" >> "$GITHUB_OUTPUT"

      - run: npx --yes ai-project-bootstrap upgrade

      - id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to refresh."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          BEHIND: ${{ steps.check.outputs.behind }}
          EDITED: ${{ steps.check.outputs.edited }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH"
          git add -A
          git commit -m "chore: refresh AI rules to v${VERSION}"
          # Force, because this branch is a rolling snapshot of "current",
          # never a history anyone builds on.
          git push --force origin "$BRANCH"

          {
            echo "Refreshes this repo's generated AI coding rules to the templates in"
            echo "\`ai-project-bootstrap@${VERSION}\`."
            echo
            echo "\`\`\`"
            git diff --stat "origin/${GITHUB_REF_NAME}...${BRANCH}" || true
            echo "\`\`\`"
            echo
            if [ "${EDITED}" != "0" ] && [ "${EDITED}" != "null" ]; then
              echo "${EDITED} file(s) you edited by hand were left untouched."
              echo
            fi
            echo "Generated by \`ai-project-bootstrap upgrade\`."
          } > /tmp/body.md

          # An open PR for this branch already picked up the push above.
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "Refresh AI rules to v${VERSION}" \
              --body-file /tmp/body.md
          else
            gh pr edit "$BRANCH" \
              --title "Refresh AI rules to v${VERSION}" \
              --body-file /tmp/body.md
          fi
