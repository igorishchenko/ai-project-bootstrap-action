name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # No install step: the action has no dependencies, which is the point.
      - run: npm test

      # R9 step 6. The rules are context/global/repo-standards.md; this is their teeth.
      - name: Repository standard
        run: node scripts/verify-repo-standards.mjs
