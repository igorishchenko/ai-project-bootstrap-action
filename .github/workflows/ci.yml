name: CI

on:
  # develop is development and preview, main is production (standard R1).
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # The standard check compares the branch with develop and main (R9).
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # No install step: the action has no dependencies, which is the point.
      - run: npm test

      # R9 step 6. The rules are context/global/repo-standards.md; this is their teeth.
      - name: Repository standard
        run: node scripts/verify-repo-standards.mjs
